<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />
  <!--HEAD-->
</head>
<body class="poster-body">
  <div class="poster-toolbar">
    <a class="btn btn-ghost btn-small" id="poster-back" href="#">← Back to event</a>
    <button class="btn btn-primary btn-small" type="button" onclick="window.print()">Print poster</button>
  </div>

  <main class="poster-sheet" id="poster-sheet">
    <div class="poster-kicker">You're invited</div>
    <h1 id="poster-name">Loading…</h1>
    <div class="poster-meta" id="poster-date"></div>
    <div class="poster-meta" id="poster-location"></div>
    <div class="poster-qr"><img id="poster-qr" alt="QR code linking to the invitation" width="220" height="220" /></div>
    <div class="poster-cta">Scan to RSVP</div>
    <div class="poster-url" id="poster-url"></div>
    <div class="poster-brand"><span class="brand-rsvp">RSVP</span><span class="brand-for">for</span></div>
  </main>

  <script src="/poster.js"></script>
</body>
</html>
