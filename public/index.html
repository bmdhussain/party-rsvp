<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party RSVP</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap narrow">
    <header class="site-header">
      <a class="brand" href="/"><span class="brand-mark">P</span>Party RSVP</a>
      <nav class="header-nav"><a class="btn btn-ghost btn-small" href="/">Home</a></nav>
    </header>
    <div class="hero">
      <div class="eyebrow" style="color:#ffe0b1;">Make room for good news</div>
      <h1>Gather beautifully.</h1>
    </div>
    <p class="tagline">Create a party in seconds. Share one link. Watch the RSVPs roll in.</p>

    <div class="card" style="max-width:430px; margin:0 auto;" id="login-card">
      <div class="eyebrow">For the host</div><h2>Open the door to your people.</h2>
      <div id="provider-buttons">
        <div class="empty-note">Loading sign-in options…</div>
      </div>
      <div class="error-msg" id="login-error"></div>
    </div>
    <footer class="site-footer"><span>Private by default. Effortless to share.</span><span>© Party RSVP</span></footer>
  </div>

  <script>
    async function init() {
      try {
        const meRes = await fetch('/api/me');
        const me = await meRes.json();
        if (me.user) {
          window.location.href = '/dashboard';
          return;
        }
      } catch (err) {
        // ignore, show login options
      }

      if (new URLSearchParams(window.location.search).get('login') === 'failed') {
        const err = document.getElementById('login-error');
        err.textContent = 'Sign-in was cancelled or failed. Please try again.';
        err.style.display = 'block';
      }

      const container = document.getElementById('provider-buttons');
      try {
        const res = await fetch('/api/auth/providers');
        const providers = await res.json();
        const buttons = [];
        if (providers.google) {
          buttons.push(
            '<a class="btn provider-btn google" href="/auth/google"><span class="icon">🔵</span> Continue with Google</a>'
          );
        }
        if (providers.facebook) {
          buttons.push(
            '<a class="btn provider-btn facebook" href="/auth/facebook"><span class="icon">📘</span> Continue with Facebook</a>'
          );
        }
        container.innerHTML = buttons.length
          ? buttons.join('')
          : '<div class="empty-note">Sign-in isn\'t configured yet. The site owner needs to add Google or Facebook login credentials.</div>';
      } catch (err) {
        container.innerHTML = '<div class="empty-note">Couldn\'t load sign-in options.</div>';
      }
    }

    init();
  </script>
</body>
</html>
